name: Mobile CI

on:
  push:
    branches: [master, main]
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  pull_request:
    branches: [master, main]
    paths: ['mobile/**', '.github/workflows/mobile.yml']

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Install packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      # Compiles the Android app (Kotlin, manifest, Gradle). Without a
      # key.properties this is signed with the debug key and is not uploadable.
      - name: Build release APK
        run: flutter build apk --release --dart-define=API_BASE_URL=https://api.example.invalid
