name: kinetiq
description: Kinetiq mobile app - AI fitness coaching, recovery scores and workout plans.
publish_to: "none"
version: 1.0.0+3

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  shared_preferences: ^2.5.3
  health: ^13.3.2
  workmanager: ^0.10.10
  permission_handler: ^13.0.2
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
